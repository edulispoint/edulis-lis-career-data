name: Update LIS recruitment feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: lis-recruitment-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install feedparser requests
      - name: Collect recruitment, admission and event updates
        run: python scripts/collect_opportunities.py
      - name: Commit updated feed
        run: |
          if [[ -n "$(git status --porcelain docs/opportunities.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/opportunities.json
            git commit -m "Update EduLIS LIS opportunities feed"
            git pull --rebase origin main
            git push origin main
          else
            echo "No feed changes to commit."
          fi
